global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vision-service
    static_configs:
      - targets: ["vision-service:8000"]
    metrics_path: /metrics

  - job_name: kie-service
    static_configs:
      - targets: ["kie-service:8000"]   # internal container port, not the host-mapped 8001
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]