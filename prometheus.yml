global:
  scrape_interval: 15s
  evaluation_interval: 15s
 
scrape_configs:
  - job_name: 'vision-service-monitoring'
    static_configs:
      - targets: ['vision-service:8000']
    metrics_path: /metrics
    scrape_interval: 10s
  - job_name: 'kie-service-monitoring'
    static_configs:
      - targets: ['kie-service:8001']
    metrics_path: /metrics
    scrape_interval: 10s