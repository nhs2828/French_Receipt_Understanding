# =============================================================
# Configuration for the SROIE dataset (English)
# To train on a different dataset: copy this file and update root_dir + entity_fields
# (Requires the new dataset to follow the same directory structure: img/box/entities like SROIE)
# =============================================================

dataset:
  root_dir: ./data/SROIE2019
  ocr_lang: en            # language for PaddleOCR at prediction (en / vi / ...)

  # Mapping: JSON fields in entities/*.txt -> BIO label names used for training
  # Changing fields/label names here does not require modifying any .py files
  entity_fields:
    - json_key: company
      label: COMPANY
    - json_key: date
      label: DATE
    - json_key: address
      label: ADDRESS
    - json_key: total
      label: TOTAL

model:
  # architecture: layoutlmv3 -> tokenizer RoBERTa, suitable for English (SROIE)
  # architecture: layoutxlm  -> tokenizer XLM-R, suitable for multiple languages/French/Vietnamese
  architecture: layoutlmv3
  base_checkpoint: microsoft/layoutlmv3-base
  max_length: 512

training:
  output_dir: ./outputs/sroie_run1

  batch_size: 2
  eval_batch_size: 2
  grad_accum_steps: 8          # effective batch size = batch_size * grad_accum_steps

  learning_rate: 2e-5
  num_epochs: 20
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  fp16: true
  logging_steps: 10
  save_total_limit: 2          # only keep the last N checkpoints, to avoid filling up the disk
  early_stopping_patience: 5

  # Turn on true if you see F1 = 0 for many epochs due to severe label imbalance
  # (dataset has many fields, entities occupy a very small proportion of tokens compared to "O")
  use_class_weights: false

  dataloader_num_workers: 2
  seed: 42