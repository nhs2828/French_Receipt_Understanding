services:
  vision-service:
    platform: linux/amd64   # PaddlePaddle segfaults on linux/arm64 — force x86 + Rosetta emulation
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "8000:8000"
    # environment:
    #   - MODEL_DIR=/app/models
    volumes:
      # bind-mount local weights for now — replace with init-container + S3
      # pull once this moves to k8s (see design doc decisions log)
      - ./services/vision-service/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/docs').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kie-service:
    build:
      context: .                                     # repo root — needs libs/vision_client
      dockerfile: services/kie-service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      # - MODEL_DIR=/app/models
      - VISION_SERVICE_URL=http://vision-service:8000/process
    volumes:
      - ./services/kie-service/models:/app/models:ro
    depends_on:
      vision-service:
        condition: service_healthy