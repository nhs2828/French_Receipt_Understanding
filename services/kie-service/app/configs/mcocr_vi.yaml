# =============================================================
# Configuration for the MC-OCR dataset (Vietnamese - retail receipts)
# Source: Mobile Captured Receipt Recognition Challenge (RIVF 2021)
# 4 official fields: SELLER, SELLER ADDRESS, TIMESTAMP, TOTAL COST
#
# NOTE: The original MC-OCR dataset DOES NOT follow the img/box/entities structure like SROIE.
# You must run scripts/convert_mcocr.py first to convert the raw train.csv
# into the exact directory structure required by data_loader.py.
# =============================================================

dataset:
  root_dir: ./data/MC-OCR-VN
  ocr_lang: vi            # PaddleOCR needs recognition model for Vietnamese, or use VietOCR separately

  entity_fields:
    - json_key: seller
      label: SELLER
    - json_key: address
      label: ADDRESS
    - json_key: timestamp
      label: DATE
    - json_key: total_cost
      label: TOTAL

model:
  # Use layoutxlm for Vietnamese -- XLM-R tokenizer handles diacritics better than RoBERTa.
  # Switch back to "layoutlmv3" if you only need a quick demo, not optimal quality.
  architecture: layoutxlm
  base_checkpoint: microsoft/layoutxlm-base
  max_length: 512

training:
  output_dir: ./outputs/mcocr_vi_run1

  batch_size: 2
  eval_batch_size: 2
  grad_accum_steps: 8

  learning_rate: 2e-5
  num_epochs: 50
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

  fp16: true
  logging_steps: 10
  save_total_limit: 2
  early_stopping_patience: 5

  # MC-OCR only has 4 fields, but Vietnamese receipts are often long with many line items
  # -> the ratio of "O" tokens relative to entities may be higher than SROIE; consider enabling if F1 stays low
  use_class_weights: false

  dataloader_num_workers: 2
  seed: 42