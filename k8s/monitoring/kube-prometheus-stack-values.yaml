# Minimal demo overrides for the prometheus-community/kube-prometheus-stack chart.
# Everything not listed here uses the chart's defaults.

grafana:
  adminPassword: admin   # change if this demo is ever exposed beyond localhost
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true       # auto-loads ConfigMaps labeled grafana_dashboard: "1" (see grafana-dashboard-configmap.yaml)
      label: grafana_dashboard
      searchNamespace: monitoring   # keep the dashboard ConfigMap in the same namespace as this release
  persistence:
    enabled: false   # dashboards/settings reset on pod restart,

prometheus:
  prometheusSpec:
    retention: 6h   # logs retention
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    # serviceMonitorSelectorNilUsesHelmValues defaults to true, so any ServiceMonitor
    # labeled release: monitoring (matching this Helm release name) is auto-discovered —
    # that's what vision-service/servicemonitor.yaml and kie-service/servicemonitor.yaml rely on.

alertmanager:
  enabled: false

nodeExporter:
  enabled: true   # CPU/mem per node for free

kubeStateMetrics:
  enabled: true
