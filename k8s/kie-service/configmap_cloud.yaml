apiVersion: v1
kind: ConfigMap
metadata:
  name: kie-service-config
  namespace: receipt-understanding
data:
  # <service>.<namespace>.svc.cluster.local is k8s's internal DNS — this replaces
  # the docker-compose "http://vision-service:8000/..." address.
  KIE_VISION_SERVICE_URL: "http://vision-service.receipt-understanding.svc.cluster.local:8000/api/v1/extract"
  S3_BUCKET: "amz-s3-receipt-understanding-423051206837-eu-west-3-an"
  S3_MODEL_PREFIX: "models/kie/"
  AWS_REGION: "eu-west-3"