apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-service
  namespace: receipt-understanding
  labels:
    app: kie-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kie-service
  template:
    metadata:
      labels:
        app: kie-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: kie-service
          image: nhs2828/kie-service:v1.0   # see DEPLOY.md for build/push steps
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: kie-service-config
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
          # NOTE: assumes kie-service exposes /api/v1/health/live and /health/ready like
          # vision-service does. Confirm kie-service's routers.py actually includes a health
          # router before relying on these — swap to /docs or /api/v1/extract's OPTIONS if not.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
      volumes:
        - name: models
          hostPath:
            # Populated by `minikube mount ./services/kie-service/models:/mnt/host-models/kie`
            # running in a separate terminal — see DEPLOY.md. Swap for an initContainer + S3 later.
            path: /mnt/host-models/kie
            type: Directory
