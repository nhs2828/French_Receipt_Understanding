# Default values for the receipt-understanding chart.
# Override any of these with: helm install ... -f values-cloud-gpu.yaml

vision:
  image:
    repository: nhs2828/vision-service-cpu
    tag: v1.0
    pullPolicy: Always
  service:
    type: ClusterIP   # internal only — kie-service is the only caller
    port: 8000
  deployMode: local    # "local" (hostPath) or "cloud" (S3 initContainer)
  models:
    hostPath: /mnt/host-models/vision   # used only when deployMode: local
  s3:                                    # used only when deployMode: cloud
    bucket: "amz-s3-receipt-understanding-423051206837-eu-west-3-an"
    modelPrefix: "models/vision/"
    region: "eu-west-3"
    credentialsSecretName: "s3-model-creds"
  gpu:
    enabled: false
    count: 1
    nodeSelector: {}
    tolerations: []
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"   # bump if the pod OOMKills
  probes:
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6   # models take a while to load
  nodeSelector: {}

kie:
  image:
    repository: nhs2828/kie-service-cpu
    tag: v1.0
    pullPolicy: Always
  service:
    type: NodePort   # front door
    port: 8000
  deployMode: local
  models:
    hostPath: /mnt/host-models/kie
  s3:
    bucket: "amz-s3-receipt-understanding-423051206837-eu-west-3-an"
    modelPrefix: "models/kie/"
    region: "eu-west-3"
    credentialsSecretName: "s3-model-creds"
  gpu:
    enabled: false
    count: 1
    nodeSelector: {}
    tolerations: []
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
  probes:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 6
  nodeSelector: {}

monitoring:
  releaseName: monitoring
  namespace: monitoring
  serviceMonitors:
    enabled: true
  dashboard:
    enabled: true