apiVersion: v1
kind: ConfigMap
metadata:
  name: vision-service-config
  namespace: {{ .Release.Namespace }}
data:
{{- if eq .Values.vision.deployMode "cloud" }}
  S3_BUCKET: {{ .Values.vision.s3.bucket | quote }}
  S3_MODEL_PREFIX: {{ .Values.vision.s3.modelPrefix | quote }}
  AWS_REGION: {{ .Values.vision.s3.region | quote }}
{{- end }}
{{- if .Values.vision.gpu.enabled }}
  PADDLEOCR_DEVICE: "gpu"
  SEG_DEVICE: "cuda:0"
{{- else }}
  PADDLEOCR_DEVICE: "cpu"
  SEG_DEVICE: "cpu"
{{- end }}