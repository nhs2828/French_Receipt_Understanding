apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: kie-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kie-service
  template:
    metadata:
      labels:
        app: kie-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      {{- $nodeSelector := merge (dict) .Values.kie.nodeSelector (ternary .Values.kie.gpu.nodeSelector (dict) .Values.kie.gpu.enabled) }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- if and .Values.kie.gpu.enabled .Values.kie.gpu.tolerations }}
      tolerations:
        {{- toYaml .Values.kie.gpu.tolerations | nindent 8 }}
      {{- end }}
      {{- if eq .Values.kie.deployMode "cloud" }}
      initContainers:
        - name: pull-models
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command:
            - sh
            - -c
            - |
              echo "Syncing s3://$S3_BUCKET/$S3_MODEL_PREFIX -> /models"
              aws s3 sync "s3://$S3_BUCKET/$S3_MODEL_PREFIX" /models --only-show-errors
              echo "Done: $(du -sh /models)"
              find /models -type f | sort
          envFrom:
            - configMapRef:
                name: kie-service-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kie.s3.credentialsSecretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kie.s3.credentialsSecretName }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      containers:
        - name: kie-service
          image: "{{ .Values.kie.image.repository }}:{{ .Values.kie.image.tag }}"
          imagePullPolicy: {{ .Values.kie.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: kie-service-config
          volumeMounts:
            - name: models
              mountPath: /app/models
              readOnly: true
          # NOTE: assumes kie-service exposes /api/v1/health/live and /health/ready like
          # vision-service does. Confirm kie-service's routers.py actually includes a health
          # router before relying on these.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: {{ .Values.kie.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.kie.probes.periodSeconds }}
            failureThreshold: {{ .Values.kie.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: {{ .Values.kie.probes.initialDelaySeconds }}
            periodSeconds: 15
          resources:
            requests:
              {{- toYaml .Values.kie.resources.requests | nindent 14 }}
              {{- if .Values.kie.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.kie.gpu.count }}
              {{- end }}
            limits:
              {{- toYaml .Values.kie.resources.limits | nindent 14 }}
              {{- if .Values.kie.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.kie.gpu.count }}
              {{- end }}
      volumes:
        - name: models
          {{- if eq .Values.kie.deployMode "cloud" }}
          emptyDir: {}
          {{- else }}
          hostPath:
            path: {{ .Values.kie.models.hostPath }}
            type: Directory
          {{- end }}