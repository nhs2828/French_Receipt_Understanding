apiVersion: v1
kind: Service
metadata:
  name: vision-service
  namespace: receipt-understanding
  labels:
    app: vision-service
spec:
  type: ClusterIP   # internal only — kie-service is the only caller, no need to expose this externally
  selector:
    app: vision-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
