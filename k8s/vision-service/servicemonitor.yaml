apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vision-service
  namespace: receipt-understanding
  labels:
    release: monitoring   # must match the kube-prometheus-stack Helm release name for auto-discovery
spec:
  selector:
    matchLabels:
      app: vision-service
  namespaceSelector:
    matchNames:
      - receipt-understanding
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
